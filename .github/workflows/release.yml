# Release Drafter and Publisher
#
# Trigger is intentionally limited to `closed`. The drafter runs with
# `commitish: develop`, so its output only ever reflects merged PRs — firing on
# `opened`/`synchronize` re-computes an identical draft on every push to every
# open PR and burns Actions minutes. Do not re-add them.
#
# Baseline release required: release-drafter v7 only lists changes since the
# last *published* release ("A previous (published) release is required to
# find changes"). Without one, every draft says "No changes". v0.0.0 is the
# manually published baseline — never delete it unless a newer release exists.
#
# Actions are pinned to commit SHAs (tag in the trailing comment) so upstream
# minor releases cannot change behaviour under us. Both run on Node 24.
# Bump deliberately: resolve the new tag's SHA and update both SHA and comment.
name: Release Drafter and Publisher

on:
  pull_request:
    types: [closed]
    branches:
      - develop

# Single draft release is shared mutable state; serialise updates instead of
# letting concurrent merges race. Never cancel — a dropped run loses its entry.
concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update release draft
        id: drafter
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
          commitish: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish draft release
        if: contains(github.event.pull_request.labels.*.name, 'Publish')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRAFT_ID: ${{ steps.drafter.outputs.id }}
        with:
          script: |
            const releaseId = Number(process.env.DRAFT_ID);
            if (!Number.isInteger(releaseId) || releaseId <= 0) {
              core.setFailed("Release drafter returned no draft id; nothing to publish.");
              return;
            }
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
              prerelease: false,
            });
            core.info(`Published release ${data.tag_name} (${data.html_url}).`);
