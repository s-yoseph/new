# Release Drafter and Publisher
#
# Trigger is intentionally limited to `closed`. The drafter runs with
# `commitish: develop`, so its output only ever reflects merged PRs — firing on
# `synchronize` re-computed an identical draft on every push to every open PR
# and was what exhausted the Actions budget. Do not re-add
# `opened`/`synchronize`. `workflow_dispatch` is the escape hatch for rebuilding
# a stale draft without merging anything; it never publishes.
#
# Three rules this workflow depends on, each learned the hard way:
#
#   1. Never create or publish a release by hand. A hand-made release becomes
#      the drafter's baseline, and everything merged before it is then treated
#      as already shipped — by a release whose notes are empty. Publish only by
#      labelling a PR `Publish`, or by publishing the drafter's own draft.
#   2. Keep one published release alive. The notes are always "changes since the
#      last published release"; with none, the `Full Changelog` compare link has
#      no previous tag to name.
#   3. Stacked PRs collapse into one entry. GitHub reports only the PR that
#      merged a commit into the branch (REST `/commits/{sha}/pulls` and GraphQL
#      `associatedPullRequests` agree), and the drafter can only list what
#      GitHub reports. If each change needs its own line, each PR must target
#      `develop` directly — never another PR's branch.
#
# Pinned to release-drafter@v6 deliberately. v6 drafts the full history when no
# published release exists; v7 refuses and writes "* No changes" instead, which
# is how this repo's notes went blank. v6 is a node20 action that GitHub
# currently force-runs on node24 with a warning — when that shim ends, migrate
# to v7 *and* migrate this config to v7's `when:`/`type:` schema at the same
# time, since v6 and v7 do not read the same config.
name: Release Drafter and Publisher

on:
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:

# Single draft release is shared mutable state; serialise updates instead of
# letting concurrent merges race. Never cancel — a dropped run loses its entry.
concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update release draft
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          commitish: develop
        env:
          # v6 reads the token from the environment; it has no `token` input.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish draft release
        # The event guard keeps a manual refresh from ever publishing. `Publish`
        # must be on the PR before it is merged; nothing re-runs afterwards.
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'Publish')
        uses: actions/github-script@v9
        env:
          DRAFT_ID: ${{ steps.drafter.outputs.id }}
        with:
          script: |
            const releaseId = Number(process.env.DRAFT_ID);
            if (!Number.isInteger(releaseId) || releaseId <= 0) {
              core.setFailed("Release drafter returned no draft id; nothing to publish.");
              return;
            }
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
              prerelease: false,
            });
            core.info(`Published release ${data.tag_name} (${data.html_url}).`);
