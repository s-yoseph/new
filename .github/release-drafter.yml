name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

template: |
  # What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: 'Breaking Changes'
    labels:
      - 'Major'
  - title: 'Enhancements'
    labels:
      - 'Enhancement'
      - 'Dev Task'
      - 'Feature'
      - 'Dev Process Optimization'
      - 'State/API'
      - 'Design/UI'
  - title: 'Bug Fixes'
    labels:
      - 'Bug'
      - 'Hot Fix'
  - title: 'Tasks'
    labels:
      - 'Task'

# The PR reference is written as an explicit markdown link rather than a bare
# "#123": GitHub's autolinker renders `#123` as a link in its own HTML, but that
# rendering was not reaching the release page in practice. `$URL` is a v6
# change-template variable (v6 README, "Change Template Variables").
change-template: '- $TITLE @$AUTHOR ([#$NUMBER]($URL))'

version-resolver:
  major:
    labels:
      - 'Major'
  minor:
    labels:
      - 'Enhancement'
      - 'Dev Task'
      - 'Feature'
      - 'Dev Process Optimization'
      - 'State/API'
      - 'Design/UI'
  patch:
    labels:
      - 'Bug'
      - 'Hot Fix'
      - 'Task'
      - 'Security'
  default: patch

exclude-labels:
  - 'Skip-Changelog'
